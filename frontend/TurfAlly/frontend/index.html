<!doctype html>
<!-- Declares the document type as HTML5 -->

<html lang="en">
  <!-- Root element of the HTML document with English language -->

  <head>
    <!-- Contains metadata, title, fonts, and external resources -->

    <meta charset="UTF-8" />
    <!-- Sets character encoding to UTF-8 for proper text display -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Adds favicon (browser tab icon) using an SVG image -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes the webpage responsive on different screen sizes -->

    <title>TurfAlly Premium Sports Booking</title>
    <!-- Title shown on the browser tab -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Imports Inter and Geist fonts from Google Fonts -->

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- Imports Google Material Symbols icons -->
  </head>

  <body>
    <!-- Main visible content of the webpage -->

    <div id="root"></div>
    <!-- Root div where the React application will be rendered -->

    <script type="module" src="/src/main.jsx"></script>
    <!-- Loads the main React JavaScript file -->
  </body>
</html>
